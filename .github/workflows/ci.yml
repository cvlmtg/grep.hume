name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tmux and ripgrep
        run: sudo apt-get update && sudo apt-get install -y tmux ripgrep

      # No source build: HUME ships a ready-to-run release archive, and
      # tests/ is a black-box suite that only needs a `hume` binary on
      # PATH. Which release gets downloaded follows tests/lib.sh's
      # MIN_HUME_VERSION (the one place that version is set): the newest
      # stable release once it ships that version, nightly until then.
      # tests/lib.sh's hume_resolve still enforces the minimum itself, so a
      # stale download fails loudly there rather than silently here.
      - name: Download hume release
        run: |
          min="$(source tests/lib.sh && echo "$MIN_HUME_VERSION")"
          # separate assignment so a gh/network failure aborts under -e,
          # rather than silently falling through to nightly
          tags="$(gh release list --repo cvlmtg/hume --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')"
          download=(--repo cvlmtg/hume --pattern '*x86_64-unknown-linux-gnu.tar.gz' --dir /tmp/hume-release)
          if ! grep -qx "v$min" <<<"$tags"; then
              download=(nightly "${download[@]}") # required version not released yet
          fi
          gh release download "${download[@]}"
          mkdir -p /tmp/hume-install
          tar xzf /tmp/hume-release/*.tar.gz -C /tmp/hume-install --strip-components=1
          echo "/tmp/hume-install/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Lint
        run: ./scripts/lint.sh

      - name: Test
        run: ./tests/run.sh
