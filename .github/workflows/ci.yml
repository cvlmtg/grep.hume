name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Which cvlmtg/hume release the tests run against: a tag ("nightly",
  # "v0.12.0"), or empty for the newest stable release. This plugin needs
  # APIs that only nightly ships until 0.12.0 is tagged.
  HUME_RELEASE: nightly

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tmux and ripgrep
        run: sudo apt-get update && sudo apt-get install -y tmux ripgrep

      # No source build: HUME ships a ready-to-run release archive, and
      # tests/ is a black-box suite that only needs a `hume` binary on
      # PATH. tests/lib.sh's hume_resolve enforces README's "HUME 0.12.0
      # or later" itself, so a stale $HUME_RELEASE fails loudly there
      # rather than silently here.
      - name: Download hume release
        run: |
          download=(--repo cvlmtg/hume --pattern '*x86_64-unknown-linux-gnu.tar.gz' --dir /tmp/hume-release)
          if [[ -n "$HUME_RELEASE" ]]; then
              download=("$HUME_RELEASE" "${download[@]}")
          fi
          gh release download "${download[@]}"
          mkdir -p /tmp/hume-install
          tar xzf /tmp/hume-release/*.tar.gz -C /tmp/hume-install --strip-components=1
          echo "/tmp/hume-install/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Lint
        run: ./scripts/lint.sh

      - name: Test
        run: ./tests/run.sh
